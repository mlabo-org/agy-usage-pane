<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usage Monitor</title>
    <style>
      :root {
        --bg-primary: var(--color-background-primary, #141416);
        --bg-secondary: var(--color-background-secondary, #1c1c20);
        --bg-tertiary: var(--color-background-tertiary, #26262c);
        --text-primary: var(--color-text-primary, #f4f4f5);
        --text-secondary: var(--color-text-secondary, #a1a1aa);
        --text-tertiary: var(--color-text-tertiary, #71717a);
        --border: var(--color-border-primary, rgba(161, 161, 170, 0.22));
        --border-soft: var(--color-border-secondary, rgba(161, 161, 170, 0.12));
        --ok: var(--color-text-success, #22c55e);
        --warn: var(--color-text-warning, #eab308);
        --danger: var(--color-text-danger, #ef4444);
        --info: var(--color-text-info, #3b82f6);
        --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-ui);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      .app {
        max-width: 760px;
        margin: 0 auto;
        padding: 12px 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-tertiary);
        flex-shrink: 0;
      }

      .dot.ok {
        background: var(--ok);
      }

      .dot.loading {
        background: var(--warn);
        animation: pulse 1.1s ease-in-out infinite;
      }

      .dot.error {
        background: var(--danger);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }

      .title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .meta-time {
        font-size: 11px;
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 500;
        padding: 4px 9px;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
        transition: opacity 0.15s ease, border-color 0.15s ease;
      }

      .btn:hover:not(:disabled) {
        border-color: var(--text-secondary);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .btn.confirm {
        border-color: var(--warn);
        color: var(--warn);
      }

      .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-soft);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .section-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .section-sub {
        font-size: 11px;
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .group + .group {
        padding-top: 8px;
        border-top: 1px solid var(--border-soft);
      }

      .group-name {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .group-badge {
        font-size: 10px;
        font-weight: 500;
        color: var(--text-tertiary);
      }

      .bucket-row {
        display: grid;
        grid-template-columns: 34px 1fr 40px;
        align-items: center;
        gap: 8px;
      }

      .bucket-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .bar-wrap {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }

      .track {
        height: 7px;
        width: 100%;
        border-radius: 999px;
        background: var(--bg-tertiary);
        overflow: hidden;
      }

      .fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.25s ease;
      }

      .fill.ok {
        background: var(--ok);
      }

      .fill.warn {
        background: var(--warn);
      }

      .fill.danger {
        background: var(--danger);
      }

      .fill.info {
        background: var(--info);
      }

      .pct {
        text-align: right;
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .pct.ok {
        color: var(--ok);
      }

      .pct.warn {
        color: var(--warn);
      }

      .pct.danger {
        color: var(--danger);
      }

      .reset-line {
        grid-column: 2 / 4;
        font-size: 10.5px;
        color: var(--text-tertiary);
        font-variant-numeric: tabular-nums;
        margin-top: -3px;
      }

      .context-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .context-main {
        display: flex;
        align-items: baseline;
        gap: 7px;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .context-pct {
        font-size: 15px;
        font-weight: 700;
      }

      .context-detail {
        font-size: 11.5px;
        color: var(--text-secondary);
      }

      .model-pill {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--text-secondary);
        background: var(--bg-tertiary);
        padding: 2px 6px;
        border-radius: 5px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cache-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .stat-box {
        background: var(--bg-tertiary);
        border-radius: 8px;
        padding: 8px 9px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .stat-label {
        font-size: 10.5px;
        color: var(--text-secondary);
      }

      .stat-value {
        font-family: var(--font-mono);
        font-size: 16px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .stat-sub {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--text-tertiary);
        font-variant-numeric: tabular-nums;
      }

      .kv-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-family: var(--font-mono);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .kv-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--text-secondary);
      }

      .kv-row strong {
        color: var(--text-primary);
        font-weight: 600;
      }

      .model-table {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-top: 6px;
        border-top: 1px solid var(--border-soft);
      }

      .model-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
        color: var(--text-secondary);
      }

      .model-line-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .banner {
        font-size: 11px;
        padding: 6px 8px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--bg-tertiary);
        color: var(--text-secondary);
      }

      .banner.error {
        border-color: var(--danger);
        color: var(--danger);
      }

      .empty {
        font-size: 12px;
        color: var(--text-tertiary);
        padding: 4px 0;
      }

      .footer {
        font-size: 10.5px;
        color: var(--text-tertiary);
        line-height: 1.4;
        padding: 0 2px;
      }
    </style>
  </head>
  <body>
    <main class="app" id="root">
      <div class="empty">読み込み中...</div>
    </main>
    <!-- INLINE_SCRIPT -->
  </body>
</html>
